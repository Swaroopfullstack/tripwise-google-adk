name: Verify TripWise ADK
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      RUN_MODE: demo
      EMBEDDING_BACKEND: hashing
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: uv python install 3.13
      - run: uv sync --frozen --extra adk --extra gradio
      - run: uv run ruff check src tests app.py demo.py
      - run: uv run pytest -q --junitxml=reports/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: reports/test-results.xml
